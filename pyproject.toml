[project]
name = "prithvi-crop-classification-pipeline"
version = "0.1.0"
description = "DIMER pipeline for Prithvi-EO-1.0-100M multi-temporal crop classification (ibm-nasa-geospatial/Prithvi-EO-1.0-100M-multi-temporal-crop-classification): 13-class crop / land-cover segmentation of three-date six-band HLS chips, held-out evaluation against a majority-class baseline, and bounded head fine-tuning with a portable adapter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = [
  # The upstream checkpoint is an mmsegmentation pickle; this package converts it once into safetensors
  # (docs/WEIGHTS.md) and rebuilds the architecture from its own vendored module (src/.../modeling.py), so no
  # mmcv, mmseg, timm or einops is needed. tifffile reads the chips.
  "torch==2.14.0",
  "tifffile==2026.9.15",
  "numpy==2.5.3",
  "safetensors==0.8.0",
  "huggingface-hub==1.32.0",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/prithvi_crop_classification_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tutorials"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
